    a {
        font-family: 'Baloo Bhaijaan 2', sans-serif;
        font-size: 22px;
        font-weight: 700;
        font-style: normal;
        display: flex;
        text-decoration: none;
        color: black;
    }

    span {
        height: 20px;
        margin-left: 10px;
    }

    .nav_pannel_pc{
        width: max-content;
        height: 70%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 7px 10px 7px 10px;
        margin: 30px 40px;
    }

    .menu-divider {
        border: none;
        border-top: 2px solid #0000003d;
        margin: 10px 0;
        width: 100%;
    }

.nav_pannel_pc a {
    color: #9a9a9a;
}

.nav_pannel_pc a svg path {
    fill: #9a9a9a;
}

.nav_pannel_pc a.active {
    color: #000;
}

.nav_pannel_pc a.active svg path {
    fill: #000;
}

</style>
